buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Pinned explicitly: an unversioned "com.android.tools.build:gradle" classpath lets
        // Gradle resolve whatever AGP happens to be cached/newest on the machine, which is
        // nondeterministic across runs (observed resolving 7.0.4 - too old for RN 0.73's
        // Kotlin sourceSets DSL - on one run and 8.1.1, the version RN 0.73 actually ships
        // with, on another).
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
