# Perfume Inventory Management System - Application Configuration

# Server Configuration
# Note: no servlet context-path here — every @RequestMapping already starts with /api,
# setting one too would double it to /api/api/**.
# Render (and most PaaS hosts) assign the listen port via $PORT at runtime.
server.port=${PORT:8080}

# The session cookie needs SameSite=None + Secure to survive a cross-site fetch when
# frontend and backend live on different Render domains (plain cross-origin CORS isn't
# enough - the browser still won't attach a Lax cookie to a cross-site XHR). Defaults
# stay Lax/non-secure for local HTTP dev, where None+Secure would just get the cookie
# dropped instead.
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# Default is 30min of inactivity, too short for "stay logged in" on mobile.
# ponytail: session is still in-memory, so a backend restart/redeploy logs
# everyone out regardless of this value - move to Spring Session JDBC if that
# becomes a real problem.
server.servlet.session.timeout=30d

# Database Configuration
# DB_URL lets production point at a real MySQL host without touching this file;
# the default keeps local dev pointed at localhost like before.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/perfumaria_estoque?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
# The JDBC driver and the Hibernate dialect follow the DB_URL (jdbc:mysql:// or jdbc:postgresql://).

# Connection pool (HikariCP). Sized for a small single instance; raise DB_POOL_MAX only
# together with the database's max_connections, and remember every extra app instance
# multiplies it. Fail fast instead of queueing requests forever when the pool is exhausted.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

# JPA/Hibernate Configuration
# Schema auto-update is convenient locally; set DDL_AUTO=validate (or none) in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# SQL echo leaks data into logs; opt in locally with SHOW_SQL=true.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Spring REST
spring.rest.path=/api

# Email Configuration (for development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Response compression (JSON is highly compressible; big win on mobile data)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Jackson Configuration
# Compact JSON: pretty-printing only inflates every response over the mobile network.
spring.jackson.serialization.indent_output=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.perfumaria=${APP_LOG_LEVEL:INFO}

# Swagger/OpenAPI (if using)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html